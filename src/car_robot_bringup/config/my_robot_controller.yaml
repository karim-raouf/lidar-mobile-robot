controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      update_rate: 50
      

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    # arm_joints_controller:
    #   type: forward_command_controller/ForwardCommandController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["base_left_wheel_joint"]
    right_wheel_names: ["base_right_wheel_joint"]

    # True physical measurements
    wheel_separation: 0.19
    wheel_radius: 0.0325


    odom_frame_id: "odom"
    base_frame_id: "base_footprint"


    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]


    enable_odom_tf: true

    publish_rate: 50.0

    linear.x.min_velocity: -0.4
    linear.x.max_velocity: 0.4
    linear.x.min_acceleration: -0.3
    linear.x.max_acceleration: 0.3

    angular.z.min_velocity: -1.5
    angular.z.max_velocity: 1.5
    angular.z.min_acceleration: -4.0
    angular.z.max_acceleration: 4.0
  
